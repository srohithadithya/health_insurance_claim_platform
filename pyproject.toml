[project]
name = "insurance-claim-platform"
version = "0.1.0"
description = "Zero-auth Indian Insurance Claim Platform with FastAPI and Leaflet"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "sqlite3",
]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"